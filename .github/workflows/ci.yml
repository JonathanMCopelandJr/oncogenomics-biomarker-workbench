# Continuous integration: lint and test on every push and pull request.
# Uses only the committed synthetic demo data. It needs no secrets or credentials and
# performs no deployment or publishing.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e .
      - name: Check formatting
        run: python -m ruff format --check src tests app
      - name: Lint
        run: python -m ruff check src tests app

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests (includes demo-data checksum and end-to-end runs)
        run: python -m pytest --cov --cov-report=term
      - name: Validate committed synthetic demo data
        run: obw validate
      - name: End-to-end analysis on synthetic data
        run: obw run-analysis --output-dir "${{ runner.temp }}/obw-outputs"
