[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncogenomics-biomarker-workbench"
version = "0.1.0"
description = "Research and education workbench for exploring SYNTHETIC cancer-transcriptomics-style data. Not for clinical use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonathan Copeland" }]
keywords = ["bioinformatics", "education", "transcriptomics", "synthetic-data", "streamlit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Compatible lower bounds only. Exact, tested pins live in requirements*.txt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "streamlit>=1.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
# Optional, only for the walkthrough notebook. Exact tested pins: requirements-notebooks.txt.
notebooks = [
    "jupyterlab>=4.0,<5",
    "ipykernel>=6.29,<8",
    "nbconvert>=7.16,<8",
    "nbclient>=0.10,<0.12",
    "nbformat>=5.10,<6",
    "nbstripout>=0.7,<1",
]

[project.scripts]
obw = "onco_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "D",   # pydocstyle (public docstrings required)
]
ignore = [
    "D105", # magic-method docstrings
    "D107", # __init__ docstrings (documented on the class)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"app/**" = ["D100", "N999"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "e2e: end-to-end pipeline tests",
]

[tool.coverage.run]
source = ["onco_workbench"]
branch = true
